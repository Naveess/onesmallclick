<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OneSmallClick · push one probe to Mars together</title>
    <meta name="description" content="The whole world flies one real probe to Mars, one small click at a time." />
    <meta name="theme-color" content="#0e1a40" />
    <link rel="icon" href="/sprites/probe.png" type="image/png" />
    <!-- Link previews (phase S1). For crew links (/c/<code>) the Worker fills in the sharer's own title and
         description and makes these links absolute (worker/share.ts). Images: public/share/. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OneSmallClick" />
    <meta property="og:title" content="OneSmallClick · push one probe to Mars together" />
    <meta property="og:description" content="The whole world flies one real probe to Mars, one small click at a time." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/share/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OneSmallClick, a pixel-art space game" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-hosted fonts, preloaded so text never swaps fonts after it appears. -->
    <link rel="preload" href="/fonts/pixelify-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Set the theme before the first paint: the saved choice, else the system setting.
         Keep the key in step with src/theme.ts. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("osc-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#b8dcff");
      })();
    </script>
    <style>
      /* Page colour (--page) before the stylesheet arrives. */
      html { background: #02040b; }
      html[data-theme="light"] { background: #e9eef7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; color: #eef3ff; padding: 24px">
        OneSmallClick needs JavaScript to play. The whole world flies one real probe to Mars, one small click at a time.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
