<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneSmallClick: launching soon</title>
  <meta name="description" content="The whole world flies one real probe to Mars, one small click at a time.">
  <meta name="theme-color" content="#05091a">
  <link rel="icon" href="/sprites/probe.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --space: #05091a;
      --space-deep: #02040b;
      --panel: #0e1a40;
      --panel-inset: #0a1636;
      --border: #7fb0e6;
      --outline: #04060f;
      --text: #eef3ff;
      --text-muted: #c9d4ee;
      --blue: #8ccfff;
      --orange: #ffb37a;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--space); }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--space);
      color: var(--text);
      font-family: "Pixelify Sans", ui-monospace, Menlo, monospace;
      line-height: 1.5;
    }
    ::selection { background: var(--blue); color: var(--space); }

    /* Pixel starfield: two 2px layers, the second twinkles in steps. */
    body::before, body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      pointer-events: none;
    }
    body::before {
      background: #6f86b8;
      box-shadow:
        8vw 12vh #6f86b8, 23vw 6vh #6f86b8, 41vw 18vh #6f86b8, 67vw 9vh #6f86b8,
        86vw 22vh #6f86b8, 12vw 38vh #6f86b8, 93vw 47vh #6f86b8, 4vw 63vh #6f86b8,
        31vw 82vh #6f86b8, 58vw 91vh #6f86b8, 79vw 76vh #6f86b8, 96vw 88vh #6f86b8,
        52vw 4vh #6f86b8, 18vw 95vh #6f86b8;
    }
    body::after {
      background: var(--text);
      box-shadow:
        16vw 24vh var(--text), 74vw 15vh var(--text), 89vw 64vh var(--text),
        7vw 84vh var(--text), 47vw 95vh var(--text), 35vw 7vh var(--text);
      animation: twinkle 3.2s steps(2) infinite;
    }
    @keyframes twinkle { 50% { opacity: .25; } }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 30rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 20px 28px;
      text-align: center;
      background: linear-gradient(to bottom, var(--panel), var(--panel-inset));
      border: 2px solid var(--border);
      outline: 2px solid var(--outline);
      box-shadow: inset 0 0 0 2px var(--panel-inset);
    }

    .probe {
      width: 128px;
      height: 80px;
      overflow: hidden;
      animation: bob 2.4s steps(2) infinite;
    }
    .probe img {
      display: block;
      width: 500%;
      height: 100%;
      max-width: none;
      image-rendering: pixelated;
      animation: sheet .75s steps(5) infinite;
    }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @keyframes sheet { to { transform: translateX(-100%); } }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(1.75rem, 7vw, 2.5rem);
      line-height: 1.1;
      text-wrap: balance;
    }
    h1 span { display: block; color: var(--orange); }
    p {
      margin: 0;
      max-width: 32ch;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 1.0625rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .probe, .probe img, body::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="probe" role="img" aria-label="Pixel-art probe OSC-1 with its thruster firing">
      <img src="/sprites/thruster-sheet.png" alt="" width="320" height="40">
    </div>
    <h1>OneSmallClick: <span>launching soon</span></h1>
    <p>The whole world flies one real probe to Mars, one small click at a time.</p>
  </main>
</body>
</html>
