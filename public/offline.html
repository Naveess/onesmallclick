<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1a40" />
    <title>OneSmallClick · no connection</title>
    <style>
      html { background: #02040b; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font: 18px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #eef3ff; text-align: center; }
      main { max-width: 420px; border: 2px solid #7fb0e6; outline: 2px solid #04060f; padding: 24px;
        background: linear-gradient(#13285a, #0b1838); }
      h1 { margin: 0 0 12px; font-size: 22px; color: #8ccfff; }
      p { margin: 0 0 16px; color: #c9d4ee; }
      button { font: inherit; min-height: 44px; padding: 0 20px; color: #05081a; background: #8ccfff; border: 2px solid #eef3ff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>The probe needs a connection</h1>
      <p>OneSmallClick can't reach the crew right now. Check your connection, then try again. The probe keeps flying without you.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
